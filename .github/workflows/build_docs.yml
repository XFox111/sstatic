name: "Build docs application"

on:
  pull_request:
    branches: [ main ]
    paths:
      - "docs/**"
      - ".github/workflows/build_docs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:26

    steps:
      - uses: actions/checkout@v7

      - run: npm install
        working-directory: docs

      - run: npm run build
        working-directory: docs

      - run: npm audit
        working-directory: docs
