<!doctype html>
<html>

<head>
	<title>API Reference - sstatic</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />

	<link rel="icon" type="image/x-icon" href="/favicon.ico">
	<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="192x192" href="/assets/android-chrome-192x192.png">
	<link rel="icon" type="image/png" sizes="512x512" href="/assets/android-chrome-512x512.png">

	<meta name="description" content="A simple self-hosted URL shortener and a file server. A perfect companion for your personal website" />
	<meta name="copyright" content="©2026 Eugene Fox" />
	<meta name="lanugage" content="en_us" />
	<meta name="author" content="Eugene Fox" />

	<meta property="og:title" content="sstatic" />
	<meta property="og:description" content="A simple self-hosted URL shortener and a file server. A perfect companion for your personal website" />
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://sstatic.xfox111.net" />

	<meta property="og:image" content="/opengraph.png" />
	<meta property="og:image:type" content="image/png" />
	<meta property="og:image:width" content="1200" />
	<meta property="og:image:height" content="675" />
</head>

<body>
	<div id="app"></div>

	<!-- Load the Script -->
	<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

	<!-- Initialize the API Reference -->
	<script>
		Scalar.createApiReference("#app", {
			url: "/openapi.yaml",
			hideTestRequestButton: true,
			hideClientButton: true,
			showSidebar: true,
			showDeveloperTools: "localhost",
			showToolbar: "localhost",
			operationTitleSource: "summary",
			theme: "default",
			persistAuth: false,
			telemetry: false,
			default: false,
			layout: "modern",
			isEditable: true,
			hideModels: false,
			documentDownloadType: "both",
			hideSearch: false,
			showOperationId: false,
			hideDarkModeToggle: false,
			withDefaultFonts: true,
			defaultOpenFirstTag: true,
			defaultOpenAllTags: false,
			expandAllModelSections: false,
			expandAllResponses: false,
			expandAllSchemaProperties: false,
			orderSchemaPropertiesBy: "alpha",
			orderRequiredPropertiesFirst: true,
			agent: { disabled: true },
			mcp: { disabled: true },
			modelsSectionLabel: "Models",
			slug: "api-1",
			title: "API #1",
			servers: [
				{ url: "https://example.com" }
			]
		});
	</script>
</body>

</html>
