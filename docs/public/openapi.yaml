      summary: Upload a file
      description: 'Upload a file to the specified directory. If file already exists, it will be overwritten.'
      operationId: UploadFile
      parameters:
        - name: path
          in: path
          description: The path of the directory to upload the file to.
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  $ref: '#/components/schemas/IFormFile'
        required: true
      responses:
        '201':
          description: File uploaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetails'
        '404':
          description: Directory not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Not Found
                status: 404
                detail: string
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Unauthorized
                status: 401
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '403':
          description: Authenticated user is not allowed to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.4
                title: Forbidden
                status: 403
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
      security:
        - Bearer: [ ]
    patch:
      tags:
        - Files
      summary: Update a file or directory
      description: 'Move or rename a file or directory on the specified path, or update text file''s content.'
      operationId: UpdateFile
      parameters:
        - name: path
          in: path
          description: The path of the file or directory to update.
          required: true
          schema:
            type: string
      requestBody:
        description: The request containing the update information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFileRequest'
        required: true
      responses:
        '201':
          description: File or directory moved successfully.
          content:
            application/json:
              schema:
                oneOf:
                  - title: FileDetails
                    $ref: '#/components/schemas/FileDetails'
                  - title: DirectoryDetails
                    $ref: '#/components/schemas/DirectoryDetails'
        '200':
          description: File's content updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetails'
        '404':
          description: File or directory not found on specified path.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Not Found
                status: 404
                detail: string
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '400':
          description: One or more validation errors occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: One or more validation errors occured.
                status: 400
                detail: string
                errors:
                  field:string:
                    - error:string
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Unauthorized
                status: 401
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '403':
          description: Authenticated user is not allowed to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.4
                title: Forbidden
                status: 403
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
      security:
        - Bearer: [ ]
    delete:
      tags:
        - Files
      summary: Delete a file or a directory
      description: Delete a file or a directory on specified path.
      operationId: DeleteFile
      parameters:
        - name: path
          in: path
          description: The path of the file or directory to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: File or directory deleted successfully.
        '404':
          description: File or directory not found on specified path.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Not Found
                status: 404
                detail: string
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '400':
          description: Cannot delete root directory.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: One or more validation errors occured.
                status: 400
                detail: string
                errors:
                  field:string:
                    - error:string
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Unauthorized
                status: 401
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '403':
          description: Authenticated user is not allowed to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.4
                title: Forbidden
                status: 403
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
      security:
        - Bearer: [ ]
components:
  schemas:
    CreateFileRequest:
      required:
        - name
        - type
      type: object
      properties:
        name:
          maxLength: 260
          minLength: 1
          pattern: '^[^/\\<>:"|?*\x00-\x1F]*[^/\\<>:"|?*\x00-\x1F\s.]$'
          type: string
          description: The name of the new item to create.
        type:
          description: The type of the new item to create.
          $ref: '#/components/schemas/ItemType'
      description: A request to create a new item.
      example:
        name: projects
    DirectoryDetails:
      required:
        - name
        - path
        - createdAt
        - updatedAt
      type: object
      properties:
        type:
          description: Gets the type of the directory child.
          $ref: '#/components/schemas/ItemType'
        name:
          type: string
          description: The name of the file.
        path:
          type: string
          description: The path of the file.
        createdAt:
          type: string
          description: The creation time of the file.
          format: date-time
        updatedAt:
          type: string
          description: The last update time of the file.
          format: date-time
        children:
          type:
            - 'null'
            - array
          description: The children of the directory. `null` if presented as a child.
      description: The details of a directory.
      example:
        name: example
        path: path/to/example
        createdAt: '2023-01-01T00:00:00Z'
        updatedAt: '2023-01-01T00:00:00Z'
        children: [ ]
        type: directory
    FileDetails:
      required:
        - name
        - path
        - createdAt
        - updatedAt
        - size
        - mime
      type: object
      properties:
        type:
          description: Gets the type of the directory child.
          $ref: '#/components/schemas/ItemType'
        name:
          type: string
          description: The name of the file.
        path:
          type: string
          description: The path of the file.
        createdAt:
          type: string
          description: The creation time of the file.
          format: date-time
        updatedAt:
          type: string
          description: The last update time of the file.
          format: date-time
        size:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: The size of the file.
          format: int64
        mime:
          type: string
          description: The detected MIME-type of the file.
      description: The details of a file.
      example:
        name: example.txt
        path: path/to/example.txt
        size: 1024
        createdAt: '2023-01-01T00:00:00Z'
        updatedAt: '2023-01-01T00:00:00Z'
        type: file
    GetRuntimeInfoResponse:
      required:
        - enableOpenApi
        - isAuthenticated
        - shortenerHost
        - shortenerPrefix
        - caseInsensitiveSlugs
        - defaultSlugLength
        - filesHost
        - filesPrefix
        - appHost
        - appPrefix
        - usePasswordAuth
        - maxFileSize
      type: object
      properties:
        enableOpenApi:
          type: boolean
          description: Indicates whether OpenAPI is enabled.
        isAuthenticated:
          type: boolean
          description: Indicates whether the user is authenticated.
        shortenerHost:
          type: string
          description: The host of the shortener service.
        shortenerPrefix:
          type: string
          description: The prefix of the shortener service.
        caseInsensitiveSlugs:
          type: boolean
          description: Indicates whether short URL slugs are case-insensitive.
        defaultSlugLength:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Default number of characters for a randomized short URL slug.
          format: int32
        filesHost:
          type: string
          description: The host of the files service.
        filesPrefix:
          type: string
          description: The prefix of the files service.
        appHost:
          type: string
          description: The host of the main application.
        appPrefix:
          type: string
          description: The prefix of the main application.
        usePasswordAuth:
          type: boolean
          description: Indicates whther the app uses password authentication.
        maxFileSize:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Maximum file size for uploading in bytes.
          format: int32
      description: A response containing runtime information about the application.
    GetUserResponse:
      required:
        - subject
        - displayName
        - email
        - idpAvatar
      type: object
      properties:
        subject:
          type: string
          description: The subject of the user.
        displayName:
          type:
            - 'null'
            - string
          description: The display name of the user.
        email:
          type:
            - 'null'
            - string
          description: The email of the user.
        idpAvatar:
          type:
            - 'null'
            - string
          description: The avatar of the user from the identity provider.
          format: uri
      description: A response containing user information.
    HealthResponse:
      required:
        - status
      type: object
      properties:
        status:
          description: The health status of the application.
          $ref: '#/components/schemas/HealthStatus'
      description: A response containing the health status of the application.
      example:
        status: healthy
    HealthStatus:
      enum:
        - unhealthy
        - degraded
        - healthy
    IFormFile:
      type: string
      format: binary
    ItemType:
      enum:
        - file
        - directory
      description: A type of a filesystem item.
    LoginRequest:
      required:
        - username
        - password
      type: object
      properties:
        username:
          type: string
          description: Username.
        password:
          type: string
          description: Plaintext password.
      description: Password login request body.
      example:
        username: user
        password: qwerty123
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
    ShortLink:
      type: object
      properties:
        slug:
          pattern: '^[a-zA-Z0-9-_.]+$'
          type: string
          description: The slug of the short link.
        redirectUrl:
          type: string
          description: The URL to redirect to.
          format: uri
        forwardQuery:
          type: boolean
          description: Whether to forward the query string from the short link to the redirect URL.
        isEnabled:
          type: boolean
          description: Whether the short link is enabled.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: The tags associated with the short link.
        createdAt:
          type: string
          description: The date and time when the short link was created.
          format: date-time
        updatedAt:
          type: string
          description: The date and time when the short link was last updated.
          format: date-time
        visits:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: Number of times the URL was visited.
          format: int32
      description: A short link in the system.
      example:
        slug: my-link
        redirectUrl: https://example.com
        forwardQuery: false
        isEnabled: true
        tags: [ ]
        createdAt: '2024-01-01T00:00:00Z'
        updatedAt: '2024-01-01T00:00:00Z'
        visits: 15
    Tag:
      type: object
      properties:
        id:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - integer
            - string
          description: The ID of the tag.
          format: int32
        name:
          maxLength: 32
          minLength: 1
          type: string
          description: The name of the tag.
        color:
          pattern: '^#[0-9a-fA-F]{6}$'
          type: string
          description: The color of the tag as a hexadecimal string.
      description: A tag in the system.
      example:
        id: 1
        name: My tag
        color: '#2596be'
    UpdateFileRequest:
      required:
        - destination
        - content
      type: object
      properties:
        destination:
          pattern: '^[^\\<>:"|?*\x00-\x1F]*[^/\\<>:"|?*\x00-\x1F\s.]$'
          type:
            - 'null'
            - string
          description: The destination path of the file or directory to update.
        content:
          type:
            - 'null'
            - string
          description: The content to update the file with.
      description: A request to update a file or directory.
      example:
        content: 'Hello, World!'
    UpdateLinkRequest:
      required:
        - slug
        - redirectUrl
        - forwardQuery
        - isEnabled
        - resetVisits
        - tags
      type: object
      properties:
        slug:
          pattern: '^[a-zA-Z0-9-_.]+$'
          type: string
          description: The slug of the short link.
        redirectUrl:
          type: string
          description: The URL to redirect to.
          format: uri
        forwardQuery:
          type: boolean
          description: Whether to forward the query string from the short link to the redirect URL.
        isEnabled:
          type: boolean
          description: Whether the short link is enabled.
        resetVisits:
          type: boolean
          description: Whether the visits coutner should be reset to 0.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: The tags associated with the short link.
      description: Request model for updating or creating a short link.
    UpdateTagRequest:
      required:
        - name
        - color
      type: object
      properties:
        name:
          maxLength: 32
          minLength: 1
          type: string
          description: The name of the tag.
        color:
          pattern: '^#[0-9a-fA-F]{6}$'
          type: string
          description: The color of the tag in hex.
      description: A request to create or update a tag.
      example:
        name: My tag
        color: '#2596be'
    ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: '^-?(?:0|[1-9]\d*)$'
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  securitySchemes:
    Bearer:
      type: http
      description: Enter a JWT bearer token.
      scheme: bearer
      bearerFormat: JWT
tags:
  - name: Tags
    description: Manage tags
  - name: Files
    description: Manage static files
  - name: Links
    description: Manage short links
  - name: Public
    description: Public endpoints
  - name: Auth
    description: Authentication-related endpoints