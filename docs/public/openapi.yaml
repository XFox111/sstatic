          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRuntimeInfoResponse'
  /_/api/links:
    get:
      tags:
        - Links
      summary: List links
      description: Retrieve all short links.
      operationId: ListLinks
      parameters:
        - name: Tags
          in: query
          description: An optional array of tag IDs to filter the links.
          schema:
            type: array
            items:
              pattern: '^-?(?:0|[1-9]\d*)$'
              type:
                - integer
                - string
              format: int32
        - name: Enabled
          in: query
          description: An optional boolean to filter links by their state (enabled/disabled).
          schema:
            type: boolean
      responses:
        '200':
          description: Links retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortLink'
        '400':
          description: One or more validation errors occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: One or more validation errors occured.
                status: 400
                detail: string
                errors:
                  field:string:
                    - error:string
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '401':
          description: Authentication is required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Unauthorized
                status: 401
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '403':
          description: Authenticated user is not allowed to access this resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.4
                title: Forbidden
                status: 403
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
      security:
        - Bearer: [ ]
    post:
      tags:
        - Links
      summary: Create link
      description: 'Create a new link by its slug. If the link contains tags that do not exist, they will be created.'
      operationId: CreateLink
      requestBody:
        description: The link data.
        content:
          application/json:
            schema:
