openapi: '3.1.1'
info:
  title: SStatic | v1
  description: "SStatic is a simple static file and link shortener server.\n\n## Authentication\nSome endpoints require authentication. SStatic is configured to use OpenID Connect (OIDC) for authentication.\nYou can obtain a JWT bearer token from your OIDC provider and include it in the `Authorization` header of your requests.\n\nYou can use [OAuth 2.0 Playground](https://oauthlabs.com/) to obtain a JWT token from your identity provider.\n\nJWT tokens are used only for testing or automation purposes. For regular usage, SStatic uses cookie-based authentication with OIDC."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
  summary: API documentation for SStatic server.
servers:
  - url: http://localhost:5141/
paths:
  /_/auth/user:
    get:
      tags:
        - Auth
      summary: Get user information
      description: Retrieve information about the authenticated user.
      operationId: GetUserInfo
      responses:
        '200':
          description: User information retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserResponse'
  /_/auth/login:
    get:
      tags:
        - Auth
      summary: Login
      description: Initiate the login process. See OpenID specification for more details.
      operationId: Login
      parameters:
        - name: redirect
          in: query
          description: The redirect URI after login.
          schema:
            type: string
      responses:
        '200':
          description: OK
    post:
      tags:
        - Auth
      summary: Log in using password
      description: "Authenticate user using login/password pair.\nOnly cookie-base authentication is available for this method.\nThis endpoint is available only if administrator has enabled it."
      operationId: PasswordLogin
      requestBody:
        description: Login request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '400':
          description: Incorrect username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: One or more validation errors occured.
                status: 400
                detail: string
                errors:
                  field:string:
                    - error:string
                traceId: 00-00000000000000000000000000000000-0000000000000000-00
        '200':
          description: User successfully logged in.
  /_/auth/oidc-signin:
    post:
      tags:
        - Auth
      summary: OpenID Connect callback
      description: Handle the OpenID Connect callback after authentication. See OpenID specification for more details.
      operationId: OidcCallback
      responses:
        '400':
          description: Invalid callback.
  /_/auth/oidc-logout:
    get:
      tags:
        - Auth
      summary: OpenID Connect logout callback
      description: Handle the OpenID Connect logout callback after signing out. See OpenID specification for more details.
      operationId: OidcLogoutCallback
      responses:
        '400':
          description: Invalid callback.
  /_/auth/logout:
    get:
      tags:
        - Auth
      summary: Logout
      description: Initiate the logout process. See OpenID specification for more details.
      operationId: Logout
      parameters:
        - name: redirect
          in: query
          description: The redirect URL after logout. Must be a relative URL
          schema:
            type: string
      responses:
        '200':
          description: OK
  /_/api/healthz:
    get:
      tags:
        - Public
      summary: Health check
      description: Check the health of the application.
      operationId: Health
      responses:
        '200':
          description: Application is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Application is unhealthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /_/api/info:
    get:
      tags:
        - Public
      summary: Get runtime information
      description: Retrieve runtime information about the application.
      operationId: GetInfo
      responses:
        '200':
